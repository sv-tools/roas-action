name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  floating-tags:
    runs-on: ubuntu-latest
    steps:
      - name: move the floating tags to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "::notice::$TAG is a prerelease; leaving the floating tags alone"
            exit 0
          fi

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a plain vMAJOR.MINOR.PATCH tag; leaving the floating tags alone"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          # The floating tags are lightweight and point at a commit, so an
          # annotated release tag needs one more hop to get past the tag object.
          ref_json="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG")"
          sha="$(jq -r '.object.sha' <<<"$ref_json")"
          if [[ "$(jq -r '.object.type' <<<"$ref_json")" == "tag" ]]; then
            sha="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object.sha')"
          fi

          for ref in "$major" "$minor"; do
            if gh api "repos/$GH_REPO/git/ref/tags/$ref" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$ref" -f "sha=$sha" -F force=true >/dev/null
            else
              gh api -X POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$ref" -f "sha=$sha" >/dev/null
            fi
            echo "::notice::$ref -> $TAG ($sha)"
          done
