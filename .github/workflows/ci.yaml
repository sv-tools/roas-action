name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck entrypoint.sh

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: validate v3.0 spec (default subcommand)
        uses: ./
        with:
          file: tests/fixtures/valid-v3_0.yaml

      - name: validate v2 spec
        uses: ./
        with:
          subcommand: openapi validate
          file: tests/fixtures/valid-v2.yaml

      - name: validate with ignored checks
        uses: ./
        with:
          subcommand: openapi validate
          file: tests/fixtures/valid-v3_0.yaml
          ignore: missing-tags unused-tags

      - name: validate must fail on invalid spec
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          subcommand: openapi validate
          file: tests/fixtures/invalid.yaml

      - name: assert invalid spec failed
        run: |
          if [[ "${{ steps.invalid.outcome }}" != "failure" ]]; then
            echo "Expected validate to fail on tests/fixtures/invalid.yaml, got outcome=${{ steps.invalid.outcome }}"
            exit 1
          fi
          echo "OK: validate correctly rejected invalid.yaml"

      - name: convert v3.0 to v3.2
        uses: ./
        with:
          subcommand: openapi convert
          file: tests/fixtures/valid-v3_0.yaml
          to: v3.2
          output-file: converted.yaml

      - name: assert converted output looks like v3.2
        run: |
          test -s converted.yaml || { echo "::error::converted.yaml is empty or missing"; exit 1; }
          grep -q '^openapi: *3\.2' converted.yaml || {
            echo "::error::converted.yaml does not declare openapi 3.2"
            cat converted.yaml
            exit 1
          }

      - name: convert with merge overlay and collapse
        uses: ./
        with:
          subcommand: openapi convert
          file: tests/fixtures/valid-v3_0.yaml
          to: v3.2
          merge: tests/fixtures/overlay-v3_0.yaml
          merge-options: deep-merge-object-schemas
          collapse: 'true'
          output-file: merged.yaml

      - name: assert merged output contains base + overlay paths
        run: |
          test -s merged.yaml || { echo "merged.yaml is empty or missing"; exit 1; }
          grep -q '/ping:' merged.yaml || { echo "merged.yaml missing /ping path from base"; cat merged.yaml; exit 1; }
          grep -q '/pong:' merged.yaml || { echo "merged.yaml missing /pong path from overlay"; cat merged.yaml; exit 1; }
          echo "OK: merge combined base and overlay paths"

      - name: legacy 'validate' spelling still works
        uses: ./
        with:
          subcommand: validate
          file: tests/fixtures/valid-v3_0.yaml

      - name: legacy 'convert' spelling still works
        uses: ./
        with:
          subcommand: convert
          file: tests/fixtures/valid-v3_0.yaml
          to: v3.2
          output-file: converted-legacy.yaml

      - name: assert the legacy convert spelling produced v3.2
        run: |
          test -s converted-legacy.yaml || { echo "::error::converted-legacy.yaml is empty or missing"; exit 1; }
          grep -q '^openapi: *3\.2' converted-legacy.yaml || {
            echo "::error::converted-legacy.yaml does not declare openapi 3.2"
            cat converted-legacy.yaml
            exit 1
          }
          echo "OK: the bare 'convert' spelling still reaches 'openapi convert'"

      - name: overlay validate
        uses: ./
        with:
          subcommand: overlay validate
          file: tests/fixtures/overlay-doc-v1_0.yaml

      - name: overlay apply to spec
        uses: ./
        with:
          subcommand: overlay apply
          file: tests/fixtures/valid-v3_0.yaml
          overlay: tests/fixtures/overlay-doc-v1_0.yaml
          output-file: overlaid.yaml

      - name: assert overlay injected the description
        run: |
          test -s overlaid.yaml || { echo "::error::overlaid.yaml is empty or missing"; exit 1; }
          grep -q 'Added by an overlay document' overlaid.yaml || {
            echo "::error::overlaid.yaml missing the overlay-injected description"
            cat overlaid.yaml
            exit 1
          }
          echo "OK: overlay apply injected the description"

      - name: convert with apply overlay
        uses: ./
        with:
          subcommand: openapi convert
          file: tests/fixtures/valid-v3_0.yaml
          to: v3.2
          apply: tests/fixtures/overlay-doc-v1_0.yaml
          output-file: converted-overlaid.yaml

      - name: assert convert --apply output is v3.2 with the description
        run: |
          test -s converted-overlaid.yaml || { echo "::error::converted-overlaid.yaml is empty or missing"; exit 1; }
          grep -q '^openapi: *3\.2' converted-overlaid.yaml || {
            echo "::error::converted-overlaid.yaml does not declare openapi 3.2"
            cat converted-overlaid.yaml
            exit 1
          }
          grep -q 'Added by an overlay document' converted-overlaid.yaml || {
            echo "::error::converted-overlaid.yaml missing the overlay-injected description"
            cat converted-overlaid.yaml
            exit 1
          }
          echo "OK: convert --apply produced v3.2 with the overlay description"

      - name: convert without 'to' must fail
        id: convert-noto
        continue-on-error: true
        uses: ./
        with:
          subcommand: openapi convert
          file: tests/fixtures/valid-v3_0.yaml

      - name: assert convert without 'to' failed
        run: |
          if [[ "${{ steps.convert-noto.outcome }}" != "failure" ]]; then
            echo "Expected openapi convert without 'to' to fail, got outcome=${{ steps.convert-noto.outcome }}"
            exit 1
          fi
          echo "OK: openapi convert correctly rejected missing 'to' input"

      - name: overlay apply without 'overlay' must fail
        id: overlay-noov
        continue-on-error: true
        uses: ./
        with:
          subcommand: overlay apply
          file: tests/fixtures/valid-v3_0.yaml

      - name: assert overlay apply without 'overlay' failed
        run: |
          if [[ "${{ steps.overlay-noov.outcome }}" != "failure" ]]; then
            echo "Expected overlay apply without 'overlay' to fail, got outcome=${{ steps.overlay-noov.outcome }}"
            exit 1
          fi
          echo "OK: overlay apply correctly rejected missing 'overlay' input"

      - name: arazzo validate
        uses: ./
        with:
          subcommand: arazzo validate
          file: tests/fixtures/arazzo-v1_0.yaml

      - name: arazzo validate must fail on invalid description
        id: arazzo-invalid
        continue-on-error: true
        uses: ./
        with:
          subcommand: arazzo validate
          file: tests/fixtures/arazzo-invalid.yaml

      - name: assert invalid arazzo description failed
        run: |
          if [[ "${{ steps.arazzo-invalid.outcome }}" != "failure" ]]; then
            echo "Expected arazzo validate to fail on tests/fixtures/arazzo-invalid.yaml, got outcome=${{ steps.arazzo-invalid.outcome }}"
            exit 1
          fi
          echo "OK: arazzo validate correctly rejected arazzo-invalid.yaml"

      - name: arazzo convert v1.0 to v1.1
        uses: ./
        with:
          subcommand: arazzo convert
          file: tests/fixtures/arazzo-v1_0.yaml
          to: v1.1
          output-file: converted-arazzo.yaml

      - name: assert converted arazzo declares version 1.1
        run: |
          test -s converted-arazzo.yaml || { echo "::error::converted-arazzo.yaml is empty or missing"; exit 1; }
          grep -qE '^arazzo:[[:space:]]*.?1\.1' converted-arazzo.yaml || {
            echo "::error::converted-arazzo.yaml does not declare arazzo 1.1"
            cat converted-arazzo.yaml
            exit 1
          }
          echo "OK: arazzo convert produced a 1.1 description"

      - name: arazzo convert without 'to' must fail
        id: arazzo-noto
        continue-on-error: true
        uses: ./
        with:
          subcommand: arazzo convert
          file: tests/fixtures/arazzo-v1_0.yaml

      - name: assert arazzo convert without 'to' failed
        run: |
          if [[ "${{ steps.arazzo-noto.outcome }}" != "failure" ]]; then
            echo "Expected arazzo convert without 'to' to fail, got outcome=${{ steps.arazzo-noto.outcome }}"
            exit 1
          fi
          echo "OK: arazzo convert correctly rejected missing 'to' input"

      - name: arazzo validate the run fixture
        uses: ./
        with:
          subcommand: arazzo validate
          file: tests/fixtures/arazzo-run.arazzo.yaml

      - name: arazzo list
        uses: ./
        with:
          subcommand: arazzo list
          file: tests/fixtures/arazzo-run.arazzo.yaml
          output-file: workflows.txt

      - name: assert arazzo list named both workflows
        run: |
          test -s workflows.txt || { echo "::error::workflows.txt is empty or missing"; exit 1; }
          for id in echoOnce echoTwice; do
            grep -q "^$id\$" workflows.txt || {
              echo "::error::workflows.txt does not list $id"
              cat workflows.txt
              exit 1
            }
          done
          grep -q 'inputs: message (string)' workflows.txt || {
            echo "::error::workflows.txt does not describe the workflow inputs"
            cat workflows.txt
            exit 1
          }
          echo "OK: arazzo list named both workflows and what they take"

      - name: arazzo run without 'workflow' must fail when several are offered
        id: arazzo-run-noworkflow
        continue-on-error: true
        uses: ./
        with:
          subcommand: arazzo run
          file: tests/fixtures/arazzo-run.arazzo.yaml
          load: file

      - name: assert arazzo run without 'workflow' failed
        run: |
          if [[ "${{ steps.arazzo-run-noworkflow.outcome }}" != "failure" ]]; then
            echo "Expected arazzo run to fail without 'workflow', got outcome=${{ steps.arazzo-run-noworkflow.outcome }}"
            exit 1
          fi
          echo "OK: arazzo run correctly asked which workflow to run"

      - name: arazzo run without a source description must fail
        id: arazzo-run-nosource
        continue-on-error: true
        uses: ./
        with:
          subcommand: arazzo run
          file: tests/fixtures/arazzo-run.arazzo.yaml
          workflow: echoOnce

      - name: assert arazzo run without a source description failed
        run: |
          if [[ "${{ steps.arazzo-run-nosource.outcome }}" != "failure" ]]; then
            echo "Expected arazzo run to fail with neither 'source' nor 'load', got outcome=${{ steps.arazzo-run-nosource.outcome }}"
            exit 1
          fi
          echo "OK: arazzo run correctly refused to run with no source description"

      - name: asyncapi validate
        uses: ./
        with:
          subcommand: asyncapi validate
          file: tests/fixtures/asyncapi-v2_6.yaml

      - name: asyncapi validate must fail on an unused channel parameter
        id: asyncapi-invalid
        continue-on-error: true
        uses: ./
        with:
          subcommand: asyncapi validate
          file: tests/fixtures/asyncapi-unused-parameter.yaml

      - name: assert invalid asyncapi document failed
        run: |
          if [[ "${{ steps.asyncapi-invalid.outcome }}" != "failure" ]]; then
            echo "Expected asyncapi validate to fail on tests/fixtures/asyncapi-unused-parameter.yaml, got outcome=${{ steps.asyncapi-invalid.outcome }}"
            exit 1
          fi
          echo "OK: asyncapi validate correctly rejected asyncapi-unused-parameter.yaml"

      - name: asyncapi validate with the check relaxed
        uses: ./
        with:
          subcommand: asyncapi validate
          file: tests/fixtures/asyncapi-unused-parameter.yaml
          check: unused-channel-parameter

      - name: asyncapi convert v2.6 to v3.0
        uses: ./
        with:
          subcommand: asyncapi convert
          file: tests/fixtures/asyncapi-v2_6.yaml
          to: v3.0
          output-file: converted-asyncapi.yaml

      - name: assert converted asyncapi declares version 3.0
        run: |
          test -s converted-asyncapi.yaml || { echo "::error::converted-asyncapi.yaml is empty or missing"; exit 1; }
          grep -qE '^asyncapi:[[:space:]]*.?3\.0' converted-asyncapi.yaml || {
            echo "::error::converted-asyncapi.yaml does not declare asyncapi 3.0"
            cat converted-asyncapi.yaml
            exit 1
          }
          grep -q 'address: light/measured' converted-asyncapi.yaml || {
            echo "::error::converted-asyncapi.yaml missing the v3 channel address"
            cat converted-asyncapi.yaml
            exit 1
          }
          echo "OK: asyncapi convert produced a 3.0 document"

      - name: asyncapi convert with 'strict' must fail on a lossy conversion
        id: asyncapi-strict
        continue-on-error: true
        uses: ./
        with:
          subcommand: asyncapi convert
          file: tests/fixtures/asyncapi-v2_6.yaml
          to: v3.0
          strict: 'true'

      - name: assert strict asyncapi convert failed
        run: |
          if [[ "${{ steps.asyncapi-strict.outcome }}" != "failure" ]]; then
            echo "Expected asyncapi convert with strict to fail on a lossy 2.6 conversion, got outcome=${{ steps.asyncapi-strict.outcome }}"
            exit 1
          fi
          echo "OK: asyncapi convert correctly refused a lossy conversion under 'strict'"

      - name: asyncapi convert without 'to' must fail
        id: asyncapi-noto
        continue-on-error: true
        uses: ./
        with:
          subcommand: asyncapi convert
          file: tests/fixtures/asyncapi-v2_6.yaml

      - name: assert asyncapi convert without 'to' failed
        run: |
          if [[ "${{ steps.asyncapi-noto.outcome }}" != "failure" ]]; then
            echo "Expected asyncapi convert without 'to' to fail, got outcome=${{ steps.asyncapi-noto.outcome }}"
            exit 1
          fi
          echo "OK: asyncapi convert correctly rejected missing 'to' input"
