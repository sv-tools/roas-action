name: 'Roas OpenAPI Action'
description: 'Validate and convert OpenAPI, AsyncAPI, Arazzo and Overlay documents with roas'
branding:
  icon: 'check-circle'
  color: 'purple'
inputs:
  subcommand:
    description: 'roas subcommand: validate, convert, overlay validate, overlay convert, overlay apply, arazzo validate, arazzo convert, asyncapi validate, or asyncapi convert'
    default: 'validate'
  file:
    description: 'Positional input: the OpenAPI spec (validate, convert, overlay apply), the Overlay document (overlay validate, overlay convert), the Arazzo description (arazzo validate, arazzo convert), or the AsyncAPI document (asyncapi validate, asyncapi convert), as JSON or YAML'
    required: true
  from:
    description: 'Force input spec version (e.g. v2, v3.0, v3.1, v3.2). Spec validate/convert only.'
  to:
    description: 'Target version. For convert: a spec version (e.g. v3.1, v3.2). For overlay convert: an overlay version (v1.0, v1.1). For arazzo convert: an arazzo version (v1.0, v1.1). For asyncapi convert: an AsyncAPI version (v2.6, v3.0, v3.1). Required for convert, overlay convert, arazzo convert, and asyncapi convert.'
  merge:
    description: 'Newline-separated list of additional specs to merge on top of the base (convert only). Each source is upconverted to the target version, then merged in incoming-order.'
  merge-options:
    description: 'Whitespace-separated merge options (convert only, requires merge): base-wins, error-on-conflict, deep-merge-object-schemas, merge-info, replace-lists-when-empty.'
  apply:
    description: 'Newline-separated list of Overlay documents to apply on top of the converted/merged spec (convert only). Applied in order, last in the pipeline (after merge, before collapse).'
  overlay:
    description: 'Newline-separated list of Overlay documents to apply to the target spec (overlay apply only). Applied in order. Required when subcommand=overlay apply.'
  apply-options:
    description: 'Whitespace-separated overlay apply options (convert with apply, or overlay apply): error-on-zero-match, error-on-mixed-kind-match.'
  collapse:
    description: 'Lift inline components into the root bag and replace call sites with $refs (convert only).'
    default: 'false'
  load:
    description: 'Whitespace-separated $ref loaders to enable: file, http'
  ignore:
    description: 'Whitespace-separated checks to skip. validate: validation checks. overlay validate / arazzo validate: empty-info-title, empty-info-version. Not used by asyncapi validate, which takes check instead.'
  check:
    description: 'Whitespace-separated validation checks to adjust (asyncapi validate only): empty-info-title, empty-info-version and unused-channel-parameter relax a check; external-reference adds one, requiring a self-contained document.'
  strict:
    description: 'Fail when the conversion had to invent a name or leave something behind, instead of reporting it and exiting 0 (asyncapi convert only).'
    default: 'false'
  quiet:
    description: 'Do not print the conversion report on stderr (asyncapi convert only).'
    default: 'false'
  format:
    description: 'Force input format: json or yaml'
  output-format:
    description: 'Force output format for convert, overlay convert, overlay apply, arazzo convert, and asyncapi convert: json or yaml'
  output-file:
    description: 'Write command output to this path instead of stdout'
  print:
    description: 'Echo the parsed spec/overlay/description/document on stdout (validate, overlay validate, arazzo validate, and asyncapi validate only)'
    default: 'false'
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
    INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
    INPUT_MERGE_OPTIONS: ${{ inputs.merge-options }}
    INPUT_APPLY_OPTIONS: ${{ inputs.apply-options }}
